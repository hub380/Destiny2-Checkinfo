name: Weekly Gear Cache

on:
  schedule:
    - cron: "23 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Check required secrets
        run: |
          if [ -z "$BUNGIE_API_KEY" ]; then
            echo "BUNGIE_API_KEY secret is required."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID secret is required."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN secret is required for weekly R2 publishing."
            exit 1
          fi
        env:
          BUNGIE_API_KEY: ${{ secrets.BUNGIE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - run: npm ci

      - name: Build gear index
        run: npm run gear:index
        env:
          BUNGIE_API_KEY: ${{ secrets.BUNGIE_API_KEY }}
          BUNGIE_LOCALE: zh-chs
          GEAR_INDEX_BUILD_MAX_BYTES: "500000000"
          GEAR_MANIFEST_TIMEOUT_MS: "60000"

      - name: Publish gear index to R2
        run: npm run gear:publish-r2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BUNGIE_LOCALE: zh-chs
          R2_BUCKET: destiny2-checkinfo-data
          R2_GEAR_PREFIX: gear-cache
