<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Destiny 2 玩家生涯</title>
    <link rel="icon" href="https://imgheybox.max-c.com/oa/2026/06/11/3271d1932bba2fe079e7305532ce2367.png" />
    <link rel="stylesheet" href="/styles.css?v=career-v2-crafting-board" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <img src="https://imgheybox.max-c.com/oa/2026/06/11/3271d1932bba2fe079e7305532ce2367.png" alt="" class="brand-mark" />
          <div>
            <h1>Destiny 2 玩家生涯</h1>
            <p>公开生涯 · Raid / 地牢 · PvP · 锻造进度</p>
          </div>
        </div>

        <nav class="main-nav" aria-label="主导航">
          <a href="/">组队</a>
          <a href="/career.html" class="current">玩家生涯</a>
          <a href="/gear.html">装备搜索</a>
        </nav>
      </header>

      <main class="career-page">
        <section class="panel career-query-panel">
          <div class="panel-header">
            <div>
              <h2>玩家查询</h2>
              <p id="careerPageSubtitle">输入棒鸡 ID 查询公开玩家生涯</p>
            </div>
          </div>

          <form class="career-search career-page-search" id="careerPageForm">
            <input id="careerPageInput" autocomplete="off" spellcheck="false" placeholder="Feng#3850" />
            <button type="submit">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m21 21-4.3-4.3M10.8 18a7.2 7.2 0 1 1 0-14.4 7.2 7.2 0 0 1 0 14.4Z" />
              </svg>
              查询
            </button>
          </form>
          <div class="notice hidden" id="careerPageNotice"></div>
        </section>

        <section class="career-detail-root" id="careerPageResult">
          <div class="career-result empty">暂无查询结果</div>
        </section>
      </main>
    </div>

    <script src="/career.js?v=career-v2-crafting-board" type="module"></script>
  </body>
</html>
