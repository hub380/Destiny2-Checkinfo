# Cloudflare Worker service name (deployment id; repo product name is Destiny2 Checkinfo)
name = "destiny2-fireteam-dashboard"
main = "src/worker.js"
compatibility_date = "2026-06-12"

[[routes]]
pattern = "destiny2.check-info.org"
zone_name = "check-info.org"
custom_domain = true

[placement]
mode = "smart"

[limits]
cpu_ms = 50

[observability]
enabled = true

[triggers]
crons = ["17 6 * * 2"]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
HEYBOX_SOURCE_URL = "https://api.xiaoheihe.cn/game/common_team_v2/home?appid=1085660"
BUNGIE_MEMBERSHIP_TYPE = "-1"
BUNGIE_LOCALE = "zh-chs"
REQUEST_TIMEOUT_MS = "15000"
DETAILS_PROFILE_TIMEOUT_MS = "45000"
HEYBOX_MAX_BYTES = "2000000"
CAREER_CACHE_TTL_SECONDS = "900"
SUMMARY_CACHE_TTL_SECONDS = "300"
ENDGAME_CACHE_TTL_SECONDS = "900"
ENDGAME_HISTORY_PAGE_LIMIT = "10"
ENDGAME_HISTORY_PAGE_SIZE = "250"
PVP_HISTORY_PAGE_LIMIT = "20"
PVP_HISTORY_PAGE_SIZE = "250"
ACTIVITY_DEFINITION_CACHE_TTL_SECONDS = "31536000"
ACTIVITY_DEFINITION_CONCURRENCY = "4"
GEAR_INDEX_CACHE_TTL_SECONDS = "604800"
GEAR_MANIFEST_MAX_BYTES = "80000000"
GEAR_MANIFEST_TIMEOUT_MS = "30000"
GEAR_CACHE_STATUS_TTL_SECONDS = "604800"
GEAR_CACHE_CHECK_TIMEOUT_MS = "10000"
R2_SNAPSHOT_PREFIX = "career-snapshots"
R2_GUIDE_PREFIX = "guides"
R2_GEAR_PREFIX = "gear-cache/v2"
GUIDE_INDEX_CACHE_TTL_SECONDS = "300"

# Optional cache bindings. KV is recommended for player JSON cache.
# Create with: npx wrangler kv namespace create CAREER_CACHE
[[kv_namespaces]]
binding = "CAREER_CACHE"
id = "76ed0ae024ae4e7ab49eefd9cbe1ad6f"

[[r2_buckets]]
binding = "CAREER_R2"
bucket_name = "destiny2-checkinfo-data"

[[d1_databases]]
binding = "PLAYER_NAMES_DB"
database_name = "destiny2"
database_id = "83ecd9b5-7ec7-41df-9573-b675851cf9bf"
migrations_dir = "migrations"
